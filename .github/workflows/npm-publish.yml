name: npm-publish

on:
  push:
    branches:
      - nitra-main

concurrency:
  group: ${{ github.ref }}-${{ github.workflow }}
  cancel-in-progress: true

jobs:
  release-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write # commit-back версії + git-тег
      id-token: write # КРИТИЧНО для OIDC!

    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: true # release пушить commit-back + тег
          fetch-depth: 0

      - uses: ./.github/actions/setup-bun-deps

      - uses: actions/setup-node@v6
        with:
          node-version: '24' # includes npm@11.6.0
          registry-url: 'https://registry.npmjs.org'

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Release (bump + CHANGELOG + tag)
        run: |
          LATEST=$(npm view @nitra/geolocation version)
          PKG=$(node -p "require('./package.json').version")
          if [ "$(printf '%s\n' "$PKG" "$LATEST" | sort -V | tail -1)" = "$PKG" ] && [ "$PKG" != "$LATEST" ]; then
            echo "package.json version $PKG is ahead of npm latest $LATEST — skipping semantic-release"
            exit 0
          fi
          bunx semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish package (npm OIDC trusted publishing)
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if npm view @nitra/geolocation@"$VERSION" version 2>/dev/null; then
            echo "Version $VERSION is already published."
            exit 0
          fi
          LATEST=$(npm view @nitra/geolocation version)
          if [ "$(printf '%s\n' "$VERSION" "$LATEST" | sort -V | tail -1)" != "$VERSION" ]; then
            echo "Refusing to publish $VERSION because npm latest is $LATEST"
            exit 1
          fi
          npm publish --access public
